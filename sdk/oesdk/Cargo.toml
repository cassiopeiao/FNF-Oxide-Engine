[package]
name = "oesdk"
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Oxide Engine mod SDK: data types, Mod trait and event dispatch"
repository = "https://github.com/cassiopeiao/FNF-Oxide-Engine"
documentation = "https://docs.rs/oesdk"
readme = "README.md"
include = ["src/**", "wit/**", "examples/**", "README.md", "LICENSE-MIT", "LICENSE-APACHE"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
oesdk_api = { version = "0.0.1", path = "../oesdk_api" }
oesdk_macro = { version = "0.0.1", path = "../oesdk_macro" }
serde = { version = "1", features = ["derive"] }
toml = "1.2"
prost = "0.14"
sha2 = "0.10"
zstd = { version = "0.13", default-features = false }
crc32fast = "1.5"
ed25519-dalek = { version = "2.2", features = ["std"] }

[[example]]
name = "basic"
