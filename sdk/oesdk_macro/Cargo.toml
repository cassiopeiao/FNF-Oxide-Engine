[package]
name = "oesdk_macro"
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Proc macros for the Oxide Engine mod SDK"
repository = "https://github.com/cassiopeiao/FNF-Oxide-Engine"
publish = false

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
